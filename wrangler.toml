name = "mentat"
main = "worker/index.js"
compatibility_date = "2026-08-17"

# The built React app. not_found_handling sends unmatched paths to index.html
# so client-side routing and page refreshes resolve instead of 404ing.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Workers AI: embeddings for retrieval, and generation.
#
# remote = true routes local dev at the real service. Neither Workers AI nor
# Vectorize has a local emulation, so without it the binding is absent from
# env during `wrangler dev`. It is ignored when deployed.
[ai]
binding = "AI"
remote = true

# Vector store for the Dune corpus. Create the index before deploying:
#
#   wrangler vectorize create dune-lore --dimensions=384 --metric=cosine
#
# 384 matches @cf/baai/bge-small-en-v1.5. The dimension count is fixed at
# creation time — changing embedding models later means a new index.
[[vectorize]]
binding = "VECTORIZE"
index_name = "dune-lore"
remote = true
